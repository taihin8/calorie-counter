name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: docker://ghcr.io/flet-dev/flet-build:latest
        entrypoint: bash
        with:
          args:
            - -c
            - >
              cd $GITHUB_WORKSPACE &&
              pip install flet &&
              flet build apk
                --project "calorie-counter"
                --product "Calorie Counter"
                --org "com.example"
                --company "Calorie Counter"
                --build-name "$(echo ${GITHUB_REF_NAME#v})"

      - name: Upload APK
        run: gh release create "${GITHUB_REF_NAME}" build/apk/*.apk --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}