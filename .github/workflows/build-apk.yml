name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # официальный образ Flet — есть Flutter + Android SDK + Python
      image: ghcr.io/flet-dev/flet-build:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          pip install flet==0.85.3

      - name: Accept Android licenses
        run: |
          flutter config --android-accept-licenses --yes
          flutter config --no-analytics

      - name: Build APK
        run: |
          flet build apk \
            --project "calorie-counter" \
            --product "Calorie Counter" \
            --org "com.example" \
            --company "Calorie Counter" \
            --build-name "${GITHUB_REF_NAME#v}"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk