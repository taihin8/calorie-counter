name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart / Flutter SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: flutter

      - name: Setup Java (Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android licenses
        run: flutter config --android-accept-licenses

      - name: Install Flet
        run: pip install flet==0.85.3

      - name: Build APK
        run: |
          flet build apk \
            --project "calorie-counter" \
            --product "Calorie Counter" \
            --org "com.example" \
            --company "Calorie Counter" \
            --build-name "${GITHUB_REF_NAME#v}"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk