name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Заметка: локальная сборка (BUILD.md) — основной путь; этот workflow
      # держим рабочим, чтобы релиз можно было собрать и из CI.
      #
      # Сборка идёт в два прохода: flet рендерит build/flutter и падает, потому
      # что плагину уведомлений нужен core library desugaring. После патча
      # (gradle + манифест) второй проход проходит. Патч flet_audio включает
      # канал будильника, иначе звонок идёт по медиа-каналу и его не слышно.
      - name: Build APK in Flet container
        run: |
          docker pull ghcr.io/flet-dev/flet-build:latest
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e GITHUB_REF_NAME \
            ghcr.io/flet-dev/flet-build:latest \
            sh -c '
              # set -e: без него упавший патч не остановит сборку, и APK
              # соберётся без канала будильника и без уведомлений
              set -ex
              python3 -m pip install flet flet-audio==0.85.3 flet-android-notifications==0.12.0
              VERSION="$(echo $GITHUB_REF_NAME | sed s/^v//)"
              flet_build() {
                python3 -m flet build apk \
                  --project "calorie-counter" \
                  --product "Calorie Counter" \
                  --org "com.taihin8" \
                  --company "Calorie Counter" \
                  --build-version "$VERSION" \
                  --android-permissions "android.permission.REQUEST_INSTALL_PACKAGES=true" "android.permission.SCHEDULE_EXACT_ALARM=true" \
                  --yes
              }
              # Первый проход рендерит проект (патчи к нему ещё не применимы;
              # при удаче он тоже ничего не портит). Патчи ставим ВСЕГДА после
              # него: иначе при удачной сборке они пропустятся, и APK выйдет
              # без уведомлений и без удержания будильника в фоне.
              flet_build || true
              python3 tools/patch_flet_audio.py
              python3 -m flet_android_notifications.patcher \
                --project-root build/flutter \
                --foreground-service-type specialUse \
                --foreground-service-subtype "Keeps scheduled alarms running"
              flet_build
            '

      - name: Upload APK to release
        run: gh release create "$GITHUB_REF_NAME" build/apk/*.apk --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
